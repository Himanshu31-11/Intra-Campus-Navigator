<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intra Campus Navigator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Intra Campus Navigator</h1>
  <p>Shortest route between two campus locations using Dijkstra's algorithm.</p>
</header>

<main>
  <section class="panel" aria-label="Route finder">
    <label for="start">Starting location</label>
    <select id="start"></select>
    <button class="swap" id="swap" type="button">Swap locations</button>
    <label for="dest">Destination</label>
    <select id="dest"></select>
    <button class="primary" id="go" type="button">Find shortest route</button>
    <div id="result" aria-live="polite"></div>
    <p class="hint">Tip: click a location on the map to set the start, then click another to set the destination.</p>
  </section>

  <section class="panel mapwrap" aria-label="Campus map">
    <svg id="map" viewBox="0 0 900 560" role="img" aria-label="Campus graph"></svg>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
